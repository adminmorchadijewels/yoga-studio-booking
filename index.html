<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book a Class | Shanti Yoga Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: 'Poppins', Arial, sans-serif;
    background-color: #f7f8fa;
    margin: 0;
    padding: 40px 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
  }
  h1 {
    color: #2c3e50;
    font-size: 26px;
    margin-bottom: 24px;
  }
  .class-card {
    background: white;
    padding: 24px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .class-info h3 {
    margin: 0 0 6px 0;
    color: #2c3e50;
    font-size: 18px;
  }
  .class-info p {
    margin: 2px 0;
    font-size: 14px;
    color: #666;
  }
  .book-btn {
    background-color: #2c3e50;
    color: white;
    border: none;
    padding: 10px 22px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
  }
  .book-btn:hover {
    background-color: #1a2634;
  }
  .full-badge {
    background-color: #e74c3c;
    color: white;
    padding: 8px 18px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
  }
  .modal {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5);
    align-items: center;
    justify-content: center;
  }
  .modal-content {
    background: white;
    padding: 30px;
    border-radius: 8px;
    max-width: 400px;
    width: 90%;
  }
  .modal-content h2 {
    color: #2c3e50;
    margin-top: 0;
  }
  .modal-content input {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    margin-bottom: 14px;
    border: 1px solid #d5d8dc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
  }
  .modal-content label {
    font-size: 14px;
    color: #555;
    font-weight: 500;
  }
  .modal-actions button {
    padding: 10px 20px;
    border-radius: 6px;
    border: none;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    margin-right: 10px;
  }
  .confirm-btn {
    background-color: #2c3e50;
    color: white;
  }
  .cancel-btn {
    background-color: #eee;
    color: #333;
  }
  #bookingMessage {
    margin-top: 10px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Shanti Yoga Studio — Book a Class</h1>
  <div id="classList">Loading classes...</div>
</div>

<div class="modal" id="bookingModal">
  <div class="modal-content">
    <h2>Book Your Spot</h2>
    <p id="modalClassInfo"></p>
    <label>Your Name</label>
    <input type="text" id="studentName" required>
    <label>Your Phone Number</label>
    <input type="text" id="studentPhone" required>
    <div class="modal-actions">
      <button class="confirm-btn" onclick="confirmBooking()">Confirm Booking</button>
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
    </div>
    <p id="bookingMessage"></p>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://djvvjavsowqpbahdsfls.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdnZqYXZzb3dxcGJhaGRzZmxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODUyNTMsImV4cCI6MjEwNDI2MTI1M30.F-5LTroyNMiz7-TljxSolSOjgWeqrB6vc_9bTpIUC7g";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var selectedClassId = null;

  async function loadClasses() {
    var classesResult = await sb.from('classes').select('*');
    var bookingsResult = await sb.from('bookings').select('*');
    var listEl = document.getElementById('classList');

    if (classesResult.error) {
      listEl.innerHTML = 'Error: ' + classesResult.error.message;
      return;
    }

    if (classesResult.data.length === 0) {
      listEl.innerHTML = '<p>No classes scheduled yet. Please check back soon!</p>';
      return;
    }

    listEl.innerHTML = '';
    classesResult.data.forEach(function(cls) {
      var bookedCount = 0;
      if (!bookingsResult.error) {
        bookedCount = bookingsResult.data.filter(function(b) { return b.class_id === cls.id; }).length;
      }
      var spotsLeft = cls.max_capacity - bookedCount;
      var isFull = spotsLeft <= 0;

      var card = document.createElement('div');
      card.className = 'class-card';
      card.innerHTML =
        '<div class="class-info">' +
          '<h3>' + cls.class_type + '</h3>' +
          '<p>' + cls.date + ' at ' + cls.time + ' — Instructor: ' + cls.instructor + '</p>' +
          '<p>' + (isFull ? 'Full' : spotsLeft + ' spots left') + ' — ₹' + cls.price + '</p>' +
        '</div>' +
        (isFull
          ? '<span class="full-badge">Full</span>'
          : '<button class="book-btn" onclick="openModal(\'' + cls.id + '\', \'' + cls.class_type + '\', \'' + cls.date + '\', \'' + cls.time + '\')">Book Now</button>');

      listEl.appendChild(card);
    });
  }

  function openModal(classId, classType, date, time) {
    selectedClassId = classId;
    document.getElementById('modalClassInfo').textContent = classType + ' — ' + date + ' at ' + time;
    document.getElementById('bookingModal').style.display = 'flex';
    document.getElementById('bookingMessage').textContent = '';
  }

  function closeModal() {
    document.getElementById('bookingModal').style.display = 'none';
    document.getElementById('studentName').value = '';
    document.getElementById('studentPhone').value = '';
  }

  async function confirmBooking() {
    var name = document.getElementById('studentName').value;
    var phone = document.getElementById('studentPhone').value;
    var messageEl = document.getElementById('bookingMessage');

    if (!name || !phone) {
      messageEl.style.color = 'red';
      messageEl.textContent = 'Please fill in both fields.';
      return;
    }

    var bookingsResult = await sb.from('bookings').select('*').eq('class_id', selectedClassId);
    var classResult = await sb.from('classes').select('*').eq('id', selectedClassId).single();

    if (bookingsResult.data.length >= classResult.data.max_capacity) {
      messageEl.style.color = 'red';
      messageEl.textContent = 'Sorry, this class just became full.';
      loadClasses();
      return;
    }

    var insertResult = await sb.from('bookings').insert([{ class_id: selectedClassId, student_name: name, student_phone: phone }]);

    if (insertResult.error) {
      messageEl.style.color = 'red';
      messageEl.textContent = 'Error: ' + insertResult.error.message;
    } else {
      messageEl.style.color = 'green';
      messageEl.textContent = 'Booking confirmed! See you in class.';
      loadClasses();
      setTimeout(closeModal, 1500);
    }
  }

  loadClasses();
</script>

</body>
</html>
