<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin | Shanti Yoga Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body {
    font-family: 'Poppins', Arial, sans-serif;
    background-color: #f7f8fa;
    margin: 0;
    padding: 40px 20px;
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
  }
  h1 {
    color: #2c3e50;
    font-size: 26px;
  }
  .card {
    background: white;
    padding: 30px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    margin-bottom: 30px;
  }
  label {
    display: block;
    margin-top: 14px;
    font-size: 14px;
    color: #555;
    font-weight: 500;
  }
  input, select {
    width: 100%;
    padding: 10px;
    margin-top: 6px;
    border: 1px solid #d5d8dc;
    border-radius: 6px;
    box-sizing: border-box;
    font-size: 15px;
  }
  button {
    background-color: #2c3e50;
    color: white;
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    margin-top: 20px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
  }
  button:hover {
    background-color: #1a2634;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    border-radius: 8px;
    overflow: hidden;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  th, td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid #eee;
    font-size: 14px;
  }
  th {
    background-color: #2c3e50;
    color: white;
    font-weight: 500;
  }
  #message {
    margin-top: 10px;
    font-size: 14px;
  }
</style>
</head>
<body>

<div class="container">
  <h1>Shanti Yoga Studio — Admin</h1>

  <div class="card">
    <h2>Add New Class</h2>
    <form id="classForm">
      <label>Class Type</label>
      <select id="class_type" required>
        <option value="">Select type</option>
        <option value="Hatha Yoga">Hatha Yoga</option>
        <option value="Power Yoga">Power Yoga</option>
        <option value="Meditation">Meditation</option>
      </select>

      <label>Date</label>
      <input type="date" id="date" required>

      <label>Time</label>
      <input type="text" id="time" placeholder="e.g. 6:00 PM" required>

      <label>Instructor</label>
      <input type="text" id="instructor" required>

      <label>Max Capacity</label>
      <input type="number" id="max_capacity" required min="1">

      <label>Price (₹)</label>
      <input type="number" id="price" required min="0">

      <button type="submit">Add Class</button>
      <p id="message"></p>
    </form>
  </div>

  <div class="card">
    <h2>All Classes</h2>
    <table>
      <thead>
        <tr>
          <th>Type</th>
          <th>Date</th>
          <th>Time</th>
          <th>Instructor</th>
          <th>Booked / Capacity</th>
          <th>Price</th>
        </tr>
      </thead>
      <tbody id="classesBody">
        <tr><td colspan="6">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
  var SUPABASE_URL = "https://djvvjavsowqpbahdsfls.supabase.co";
  var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRqdnZqYXZzb3dxcGJhaGRzZmxzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2ODUyNTMsImV4cCI6MjEwNDI2MTI1M30.F-5LTroyNMiz7-TljxSolSOjgWeqrB6vc_9bTpIUC7g";
  var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  document.getElementById('classForm').addEventListener('submit', async function(e) {
    e.preventDefault();

    var class_type = document.getElementById('class_type').value;
    var date = document.getElementById('date').value;
    var time = document.getElementById('time').value;
    var instructor = document.getElementById('instructor').value;
    var max_capacity = document.getElementById('max_capacity').value;
    var price = document.getElementById('price').value;

    var result = await sb.from('classes').insert([{ class_type: class_type, date: date, time: time, instructor: instructor, max_capacity: max_capacity, price: price }]);

    var messageEl = document.getElementById('message');
    if (result.error) {
      messageEl.style.color = 'red';
      messageEl.textContent = 'Error: ' + result.error.message;
    } else {
      messageEl.style.color = 'green';
      messageEl.textContent = 'Class added successfully!';
      document.getElementById('classForm').reset();
      loadClasses();
    }
  });

  async function loadClasses() {
    var classesResult = await sb.from('classes').select('*');
    var bookingsResult = await sb.from('bookings').select('*');
    var tbody = document.getElementById('classesBody');

    if (classesResult.error) {
      tbody.innerHTML = '<tr><td colspan="6">Error: ' + classesResult.error.message + '</td></tr>';
      return;
    }

    if (classesResult.data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6">No classes yet. Add one above!</td></tr>';
      return;
    }

    tbody.innerHTML = '';
    classesResult.data.forEach(function(cls) {
      var bookedCount = 0;
      if (!bookingsResult.error) {
        bookedCount = bookingsResult.data.filter(function(b) { return b.class_id === cls.id; }).length;
      }

      var row = document.createElement('tr');
      row.innerHTML =
        '<td>' + cls.class_type + '</td>' +
        '<td>' + cls.date + '</td>' +
        '<td>' + cls.time + '</td>' +
        '<td>' + cls.instructor + '</td>' +
        '<td>' + bookedCount + ' / ' + cls.max_capacity + '</td>' +
        '<td>₹' + cls.price + '</td>';
      tbody.appendChild(row);
    });
  }

  loadClasses();
</script>

</body>
</html>
